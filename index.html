<!DOCTYPE html>
<html>
<head>
  <title>Mini YouTube Clone (No API)</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      background: #202020;
      padding: 15px;
    }

    input {
      width: 60%;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      padding: 10px;
    }

    .card {
      background: #222;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    iframe {
      width: 80%;
      height: 400px;
      margin-top: 20px;
    }

    a {
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h2>Mini YouTube Clone 😄</h2>
  <input id="searchBox" placeholder="Search YouTube..." />
  <button onclick="search()">Search</button>
</header>

<div id="player"></div>
<div class="results" id="results"></div>

<script>
function search() {
  const q = document.getElementById("searchBox").value;

  // This uses YouTube's public search page (no API needed)
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;

  fetch(url)
    .then(res => res.text())
    .then(html => {
      const videoIds = [...html.matchAll(/"videoId":"(.*?)"/g)].map(m => m[1]);

      const results = document.getElementById("results");
      results.innerHTML = "";

      const unique = [...new Set(videoIds)].slice(0, 12);

      unique.forEach(id => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" width="100%">
          <p>Click to play</p>
        `;
        div.onclick = () => play(id);

        results.appendChild(div);
      });
    });
}

function play(id) {
  document.getElementById("player").innerHTML = `
    <iframe src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe>
  `;
}
</script>

</body>
</html>
