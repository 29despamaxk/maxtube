<!DOCTYPE html>
<html>
<head>
  <title>Mini YouTube Clone</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 15px;
      background: #202020;
    }

    input {
      width: 60%;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
      padding: 10px;
    }

    .video {
      cursor: pointer;
      background: #222;
      padding: 10px;
      border-radius: 8px;
    }

    iframe {
      width: 80%;
      height: 400px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>Mini YouTube Clone 😄</h1>
  <input id="search" placeholder="Search videos..." />
  <button onclick="searchVideos()">Search</button>
</header>

<div id="player"></div>
<div id="results"></div>

<script>
const API_KEY = "YOUR_YOUTUBE_API_KEY"; // replace this

function searchVideos() {
  const query = document.getElementById("search").value;

  fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=10&q=${query}&key=${API_KEY}`)
    .then(res => res.json())
    .then(data => {
      const results = document.getElementById("results");
      results.innerHTML = "";

      data.items.forEach(item => {
        const videoId = item.id.videoId;
        const title = item.snippet.title;

        const div = document.createElement("div");
        div.className = "video";
        div.innerHTML = `<p>${title}</p>`;
        div.onclick = () => playVideo(videoId);

        results.appendChild(div);
      });
    });
}

function playVideo(id) {
  document.getElementById("player").innerHTML = `
    <iframe src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe>
  `;
}
</script>

</body>
</html>
